name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Qt
        run: pacman -Syu --noconfirm git qt6-base qt6-declarative qt6-wayland qt6-svg
      - uses: actions/checkout@v4
      - name: Build
        run: bin/build
      - name: Test
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: bin/test
